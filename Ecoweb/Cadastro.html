<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECO-WEB - Cadastro e Login</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('images/FlorestaIA.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: rgba(27, 77, 46, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 400px;
      color: white;
      text-align: center;
      position: relative;
      backdrop-filter: blur(6px);
      transition: 0.4s;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 28px;
      font-weight: bold;
      color: #3ad7ff;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(58, 215, 255, 0.8);
    }

    .logo-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 5px;
      box-shadow: 0 0 12px rgba(58, 215, 255, 0.6);
    }

    h2 { margin-bottom: 25px; }

    label {
      display: block;
      text-align: left;
      margin: 10px 0 5px;
      color: #cce3d4;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #0e2918;
      color: white;
      font-size: 15px;
      margin-bottom: 15px;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.6);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #3ad7ff;
      border: none;
      border-radius: 8px;
      color: #0e2918;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(58, 215, 255, 0.5);
    }

    button:hover {
      background-color: #00bfff;
      transform: translateY(-2px);
    }

    .mensagem {
      margin-top: 15px;
      color: #a4ffb0;
      display: none;
    }

    .switch-link {
      margin-top: 15px;
      font-size: 14px;
      color: #cce3d4;
    }

    .switch-link a {
      color: #3ad7ff;
      text-decoration: none;
      font-weight: bold;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }

    .hidden { display: none; }

    /* ====== BOTÃO GOOGLE ====== */
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #fff;
      color: #333;
      border: none;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .google-btn:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }

    .google-btn img {
      width: 22px;
      height: 22px;
    }

    .divider {
      margin: 15px 0;
      color: #cce3d4;
      font-size: 14px;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #cce3d4;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo">
      ECO-WEB
      <img src="images/Arara_branca.png" alt="Logo Arara Azul" class="logo-img">
    </div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form id="cadastroForm">
      <h2>Criar conta</h2>

      <label for="nome">Nome completo</label>
      <input type="text" id="nome" placeholder="Digite seu nome" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Digite seu e-mail" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Crie uma senha" required>

      <label for="confirmar">Confirmar senha</label>
      <input type="password" id="confirmar" placeholder="Repita sua senha" required>

      <button type="submit">Cadastrar</button>

      <div class="divider">ou</div>

      <!-- Botão Google -->
      <button type="button" class="google-btn" id="googleCadastro">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
        Continuar com Google
      </button>

      <p class="mensagem" id="mensagemCadastro">Cadastro realizado com sucesso! Redirecionando...</p>

      <p class="switch-link">Já tem uma conta? <a href="#" id="irLogin">Entrar</a></p>
    </form>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="loginForm" class="hidden">
      <h2>Entrar</h2>

      <label for="loginEmail">E-mail</label>
      <input type="email" id="loginEmail" placeholder="Digite seu e-mail" required>

      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" placeholder="Digite sua senha" required>

      <button type="submit">Entrar</button>

      <div class="divider">ou</div>

      <!-- Botão Google -->
      <button type="button" class="google-btn" id="googleLogin">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
        Entrar com Google
      </button>

      <p class="mensagem" id="mensagemLogin">Login realizado com sucesso! Redirecionando...</p>

      <p class="switch-link">Não tem conta? <a href="#" id="irCadastro">Criar conta</a></p>
    </form>

  </div>

  <script>
  const cadastroForm = document.getElementById("cadastroForm");
  const loginForm = document.getElementById("loginForm");
  const msgCadastro = document.getElementById("mensagemCadastro");
  const msgLogin = document.getElementById("mensagemLogin");

  const irLogin = document.getElementById("irLogin");
  const irCadastro = document.getElementById("irCadastro");

  // Trocar entre telas
  irLogin.addEventListener("click", () => {
    cadastroForm.classList.add("hidden");
    loginForm.classList.remove("hidden");
  });

  irCadastro.addEventListener("click", () => {
    loginForm.classList.add("hidden");
    cadastroForm.classList.remove("hidden");
  });

  // Cadastro — redireciona após cadastrar
  cadastroForm.addEventListener("submit", (e) => {
    e.preventDefault();
    msgCadastro.style.display = "block";
    msgCadastro.textContent = "Cadastro realizado com sucesso! Redirecionando...";
    setTimeout(() => {
      window.location.href = "index.html"; // redireciona para a página principal
    }, 1500);
  });

  // Login — redireciona após login
  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    msgLogin.style.display = "block";
    msgLogin.textContent = "Login realizado com sucesso! Redirecionando...";
    setTimeout(() => {
      window.location.href = "index.html"; // redireciona para a página principal
    }, 1500);
  });

  // Google Login/Cadastro simulado
  document.getElementById("googleCadastro").addEventListener("click", () => {
    alert("✅ Cadastro via Google concluído com sucesso!");
    window.location.href = "index.html";
  });

  document.getElementById("googleLogin").addEventListener("click", () => {
    alert("✅ Login via Google realizado com sucesso!");
    window.location.href = "index.html";
  });
</script>

</body>
</html>
