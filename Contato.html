<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - ECO-WEB</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                  url('images/plano_de_fundo.png') center/cover no-repeat;
      color: #fff;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      background: rgba(25,58,30,0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      width: 55px;
      transition: transform 0.3s ease;
    }

    .logo img:hover {
      transform: rotate(-5deg) scale(1.05);
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #e8fbe3;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    nav ul {
      display: flex;
      gap: 25px;
    }

    nav ul li { list-style: none; }

    nav ul li a {
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      padding-bottom: 4px;
      position: relative;
      transition: color 0.3s ease;
    }

    nav ul li a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background: #a4e4b0;
      transition: width 0.3s ease;
    }

    nav ul li a:hover {
      color: #a4e4b0;
    }

    nav ul li a:hover::after {
      width: 100%;
    }

    main {
      max-width: 800px;
      margin: 80px auto 60px;
      padding: 0 20px;
    }

    h2 {
      text-align: center;
      font-size: 2.2rem;
      color: #a4e4b0;
      margin-bottom: 40px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }

    form {
      background-color: #e8f5e9;
      color: #1b5e20;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    form label {
      font-weight: 600;
      color: #2e7d32;
    }

    form input, form textarea {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2e7d32;
      font-size: 1rem;
    }

    form button {
      background-color: #43a047;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.3s;
    }

    form button:hover {
      background-color: #66bb6a;
      transform: translateY(-2px);
    }

    .info {
      margin-top: 40px;
      text-align: center;
      color: #fff;
      line-height: 1.8;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #1b5e20;
      color: #fff;
    }

    @media (max-width: 768px) {
      header h1 { font-size: 1.6rem; }
      h2 { font-size: 1.8rem; }
      nav ul { gap: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/Arara_branca.png" alt="Logo EcoWeb">
      <h1>ECO-WEB</h1>
    </div>

    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contato.html">Contato</a></li>
        <li><a href="assinatura.html">Assinatura</a></li>
        <li><a href="loja.html">Loja</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Fale Conosco</h2>

    <form>
      <label>Nome:</label>
      <input type="text" placeholder="Seu nome">

      <label>E-mail:</label>
      <input type="email" placeholder="seuemail@exemplo.com">

      <label>Mensagem:</label>
      <textarea placeholder="Digite sua mensagem..." rows="5"></textarea>

      <button type="submit">Enviar Mensagem</button>
    </form>

    <section class="info">
      <p><strong>Telefone:</strong> (11) 4002-8922</p>
      <p><strong>Email:</strong> MininusEcoweb@gmail.com.br</p>
      <p><strong>Endereço:</strong> Rua Morioh, 318 - São Paulo, SP</p>
    </section>
  </main>

  <footer>
    <p>© 2025 ECO-WEB | Promovendo um futuro mais verde 🌎</p>
  </footer>

</body>
</html>
